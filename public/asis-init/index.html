<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <script>
      (function(){var m={};var fake={getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}},key:function(i){return Object.keys(m)[i]||null}};
      Object.defineProperty(fake,'length',{get:function(){return Object.keys(m).length}});
      try{Object.defineProperty(window,'localStorage',{configurable:true,get:function(){return fake}});}catch(e){}
      try{Object.defineProperty(window,'sessionStorage',{configurable:true,get:function(){return fake}});}catch(e){}})();
    </script>
