<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이음 — 세대를 잇다, 마음을 나누다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
<style>
  :root{
    --ink:#241d17; --paper:#ffffff; --cream:#fbf7f2; --cream2:#f4ede4;
    --coral:#BE5535; --coral-d:#9E4329; --coral-soft:#f4e7e0;
    --green:#4b7a52; --green-soft:#e9f1e7; --purple:#6a5aa0; --purple-soft:#efeaf6;
    --clay:#9a6a52; --sub:#5f564d; --mut:#9b9186; --line:#eee6dc;
    --e1:0 1px 3px rgba(36,29,23,.05); --e2:0 12px 32px rgba(36,29,23,.09); --e3:0 30px 70px rgba(36,29,23,.14);
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif; color:var(--ink);
    background:var(--paper); line-height:1.62; -webkit-font-smoothing:antialiased; letter-spacing:-.1px;
    word-break:keep-all; line-break:strict;}
  h1,h2,h3,p,span,div{word-break:keep-all;} h1,h2{text-wrap:balance;} p{text-wrap:pretty;}
  img{display:block; max-width:100%;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 28px;}
  .num{font-variant-numeric:tabular-nums;}
  .kick{font-size:13px; font-weight:700; color:var(--coral); letter-spacing:1.4px; text-transform:uppercase; margin-bottom:16px;}

  .btn{display:inline-flex; align-items:center; gap:8px; font-weight:700; border-radius:13px; padding:13px 22px; font-size:15px; cursor:pointer; border:1.5px solid transparent; transition:transform .16s var(--ease), box-shadow .16s var(--ease), background .16s;}
  .btn:focus-visible{outline:3px solid rgba(190,85,53,.4); outline-offset:2px;}
  .btn-p{background:var(--coral); color:#fff; box-shadow:0 8px 20px rgba(190,85,53,.24);}
  .btn-p:hover{background:var(--coral-d); transform:translateY(-2px); box-shadow:0 14px 30px rgba(190,85,53,.3);}
  .btn-g{background:var(--paper); color:var(--ink); border-color:var(--line);}
  .btn-g:hover{border-color:var(--clay); transform:translateY(-2px);}
  .btn-lg{padding:16px 28px; font-size:16px; border-radius:15px;}

  nav{position:sticky; top:0; z-index:60; background:rgba(255,255,255,.8); backdrop-filter:blur(14px); border-bottom:1px solid transparent; transition:box-shadow .25s, border-color .25s;}
  nav.solid{border-color:var(--line); box-shadow:var(--e1);}
  .nav-in{display:flex; align-items:center; justify-content:space-between; height:72px; transition:height .25s var(--ease);}
  nav.solid .nav-in{height:62px;}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand img{width:32px; height:32px; border-radius:9px;}
  .brand .wm{font-size:21px; font-weight:800; color:var(--ink); letter-spacing:-.5px;}
  .nav-menu{display:flex; gap:28px; font-size:15px; color:var(--sub); font-weight:500;}
  .nav-menu a{position:relative;}
  .nav-menu a::after{content:""; position:absolute; left:0; right:0; bottom:-6px; height:2px; background:var(--coral); transform:scaleX(0); transform-origin:left; transition:transform .25s var(--ease);}
  .nav-menu a:hover{color:var(--ink);} .nav-menu a:hover::after{transform:scaleX(1);}

  .win{border-radius:16px; overflow:hidden; border:1px solid var(--line); box-shadow:var(--e2); background:#fff;}
  .win .bar{display:flex; align-items:center; gap:8px; padding:10px 14px; background:#f6f2ec; border-bottom:1px solid var(--line);}
  .win .bar i{width:10px; height:10px; border-radius:50%; background:#dcd4c9;}
  .win .bar .url{margin-left:10px; font-size:12px; color:var(--mut); background:#fff; border:1px solid var(--line); border-radius:8px; padding:4px 12px;}
  .win img{width:100%; display:block;}

  .hero{background:linear-gradient(180deg,#fff, var(--cream)); overflow:hidden;}
  .hero-grid{display:grid; grid-template-columns:1.02fr .98fr; gap:56px; align-items:center; padding:76px 0 88px;}
  .hero-eye{display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; letter-spacing:.4px; color:var(--coral); background:var(--coral-soft); padding:7px 14px; border-radius:999px; margin-bottom:22px;}
  h1.hero-h{font-size:clamp(38px,5.2vw,62px); line-height:1.12; font-weight:800; letter-spacing:-1.8px;}
  h1.hero-h .ac{color:var(--coral);}
  .hero-sub{font-size:clamp(17px,1.5vw,20px); color:var(--sub); margin:24px 0 34px; max-width:33ch;}
  .hero-cta{display:flex; gap:12px; flex-wrap:wrap;}
  .hero-media{position:relative; will-change:transform;}
  .photoframe{border-radius:26px; overflow:hidden; box-shadow:var(--e3); border:1px solid var(--line);}
  .photoframe img{width:100%; aspect-ratio:4/3.4; object-fit:cover; object-position:center 32%; display:block;}
  .float{position:absolute; left:-22px; bottom:-18px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:11px 15px; box-shadow:var(--e3); display:flex; align-items:center; gap:11px;}
  .float .dots{display:flex;}
  .float .dots i{width:24px; height:24px; border-radius:50%; border:2px solid #fff; margin-left:-8px;}
  .float .ft{font-size:12.5px; color:var(--sub);} .float .ft b{color:var(--ink);}
  .float .live{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--green); font-weight:700; margin-top:2px;}
  .float .live::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--green);}

  .marq{border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--paper);}
  .marq-in{display:flex; align-items:center; gap:36px; padding:22px 0; flex-wrap:wrap; justify-content:center; color:var(--mut); font-weight:600; font-size:15px;}
  .marq-in .lbl{font-size:12px; letter-spacing:1.2px; color:var(--clay); font-weight:700;}

  section{padding:78px 0;}
  h2{font-size:clamp(29px,3.4vw,44px); line-height:1.18; font-weight:800; letter-spacing:-1.1px;}
  h2 .ac{color:var(--coral);}
  .lead{max-width:680px; margin-bottom:48px;}
  .lead p{font-size:18px; color:var(--sub); margin-top:16px;}

  .split{display:grid; grid-template-columns:1fr 1.02fr; gap:64px; align-items:center;}
  .illust{border-radius:26px; overflow:hidden; box-shadow:var(--e3); border:1px solid var(--line);}
  .illust img{width:100%; display:block;}
  .portframe{border-radius:24px; overflow:hidden; box-shadow:var(--e2); border:1px solid var(--line);}
  .portframe img{width:100%; aspect-ratio:4/4.7; object-fit:cover; object-position:center 26%; display:block;}
  .vals{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:52px;}
  .val{background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:22px 22px 24px;}
  .val .ic{width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:24px; margin-bottom:14px;}
  .val h3{font-size:18px; font-weight:700; margin-bottom:6px;}
  .val p{font-size:14px; color:var(--sub);}
  .cyclehd{text-align:center; margin:66px 0 6px;}
  .cyclehd .kick{display:inline-block;}
  .cycle{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; margin:30px 0 40px;}
  .cnode{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:16px 24px; text-align:center; min-width:150px; box-shadow:var(--e1);}
  .cnode .e{font-size:26px;} .cnode .t{font-size:15px; font-weight:800; margin-top:6px;} .cnode .s{font-size:12px; color:var(--mut); margin-top:2px;}
  .carrow{font-size:20px; color:var(--coral); font-weight:700;}
  .roles{display:grid; gap:12px; max-width:720px; margin:0 auto;}
  .role{display:flex; gap:14px; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:15px 18px; box-shadow:var(--e1); transition:transform .18s var(--ease);}
  .role:hover{transform:translateX(4px);}
  .role .bg{font-size:12px; font-weight:800; padding:6px 13px; border-radius:999px; flex:none;}
  .role p{font-size:15px; color:var(--sub);}
  @media(max-width:880px){ .carrow{transform:rotate(90deg);} .cnode{min-width:0; width:100%;} }

  .band{background:var(--cream);}
  .axgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px;}
  .axcard{background:var(--paper); border:1px solid var(--line); border-radius:20px; overflow:hidden; box-shadow:var(--e1); transition:transform .2s var(--ease), box-shadow .2s var(--ease);}
  .axcard:hover{transform:translateY(-5px); box-shadow:var(--e2);}
  .axshot{aspect-ratio:4/3; background:var(--cream2); display:flex; align-items:center; justify-content:center; padding:14px; border-bottom:1px solid var(--line);}
  .axshot img{max-width:100%; max-height:100%; object-fit:contain; border-radius:8px;}
  .axcard .bd{padding:20px 22px 26px;}
  .axcard .tag{display:inline-block; font-size:11px; font-weight:700; color:var(--coral-d); background:var(--coral-soft); padding:4px 10px; border-radius:999px; margin-bottom:10px;}
  .axcard h3{font-size:19px; font-weight:700; margin-bottom:7px; letter-spacing:-.4px;}
  .axcard p{font-size:14px; color:var(--sub);}
  .axrows{display:grid; gap:56px; margin-top:8px;}
  .axrow{display:grid; grid-template-columns:1fr 1.12fr; gap:56px; align-items:center;}
  .axrow.rev{grid-template-columns:1.12fr 1fr;}
  .axrow .win{background:var(--paper);}
  .axrow .tag{display:inline-block; font-size:12px; font-weight:700; color:var(--coral-d); background:var(--coral-soft); padding:5px 12px; border-radius:999px; margin-bottom:12px;}
  .axrow h3{font-size:23px; font-weight:800; letter-spacing:-.6px; margin-bottom:8px;}
  .axrow p{font-size:16px; color:var(--sub);}
  .axphone{width:300px; margin:0 auto; background:#1c1712; border-radius:46px; padding:8px; box-shadow:0 30px 70px rgba(36,29,23,.2), inset 0 0 0 2px #3a2c22;}
  .axsc{background:#faf3ee; border-radius:38px; overflow:hidden; position:relative; min-height:544px;}
  .axnotch{position:absolute; top:9px; left:50%; transform:translateX(-50%); width:104px; height:20px; background:#1c1712; border-radius:12px; z-index:6;}
  .axstat{display:flex; justify-content:space-between; align-items:center; padding:11px 22px 3px; font-size:12px; font-weight:700; color:var(--ink);}
  .axstat .r{display:inline-flex; align-items:center; gap:6px;}
  .axstat .bars{display:inline-flex; gap:2px; align-items:flex-end;}
  .axstat .bars i{width:3px; background:var(--ink); border-radius:1px;}
  .axstat .batt{display:inline-block; width:20px; height:11px; border:1.5px solid var(--ink); border-radius:3px; position:relative;}
  .axstat .batt::after{content:''; position:absolute; left:1.5px; top:1.5px; bottom:1.5px; width:68%; background:var(--ink); border-radius:1px;}
  .axhd{background:#fff; padding:8px 15px 11px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #f2e9df;}
  .axhd .bk{font-size:19px; color:#a99e93;}
  .axhd .ico{width:26px; height:26px; border-radius:8px; background:var(--coral); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex:none;}
  .axhd .tt{font-size:14px; font-weight:700; line-height:1.15;} .axhd .tt small{display:block; font-size:10px; color:var(--mut); font-weight:500;}
  .axbd{padding:18px 16px 22px;}
  .axtile{background:#fff; border:1px solid #f0e7dd; border-radius:12px; padding:12px 8px; text-align:center;}
  .axtile .e{font-size:20px;} .axtile .l{font-size:12px; font-weight:700; margin-top:5px;}
  .axrowc{background:#fff; border:1px solid #f0e7dd; border-radius:13px; padding:11px 12px; margin-bottom:9px; display:flex; align-items:center; gap:10px;}
  .axrowc .ic{width:34px; height:34px; border-radius:9px; background:var(--coral-soft); display:flex; align-items:center; justify-content:center; font-size:16px; flex:none;}
  .axrowc b{font-weight:700; font-size:13px;} .axrowc small{display:block; color:var(--mut); font-size:11px;}
  .axbtn{background:var(--coral); color:#fff; text-align:center; border-radius:12px; padding:12px; font-weight:700; font-size:14px; margin-top:4px;}
  .mbwrap{background:#faf7f2; padding:20px;}
  .mbtop{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .mbtitle{font-size:17px; font-weight:800;} .mbsub{font-size:12px; color:var(--mut); margin-top:2px;}
  .mbai{background:var(--coral); color:#fff; font-size:12px; font-weight:700; padding:8px 14px; border-radius:10px;}
  .mbgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  .mbcard{background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px;}
  .mbhd{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .mbid{font-size:13px; font-weight:700;} .mbfit{font-size:11px; font-weight:700; color:#0f8a3c; background:#e8f6ec; padding:3px 9px; border-radius:999px;}
  .mbavs{display:flex; justify-content:space-around; text-align:center;}
  .mbavs .av{width:40px; height:40px; border-radius:50%; margin:0 auto; display:flex; align-items:center; justify-content:center; font-size:19px;}
  .mbavs .nm{font-size:12px; font-weight:700; margin-top:5px;} .mbavs .rl{font-size:10px; color:var(--mut);}
  .mbft{display:flex; justify-content:space-between; font-size:11px; color:var(--mut); margin-top:12px; padding-top:10px; border-top:1px solid var(--line);}
  .mbwait{display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:12px;}
  .mbwait > span:first-child{color:var(--sub); font-weight:600;}
  .mbwaitp{background:var(--cream2); padding:6px 11px; border-radius:999px; font-weight:600;}
  .hbadges{display:flex; gap:8px; flex-wrap:wrap; margin-top:20px;}
  .hbadge{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:7px 13px; border-radius:999px; background:var(--paper); border:1px solid var(--line); color:var(--sub);}
  .pubgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
  .pubcard{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:22px 20px; box-shadow:var(--e1);}
  .pubcard .v{font-family:"Fraunces",serif; font-size:34px; font-weight:600; color:var(--coral); letter-spacing:-1px;}
  .pubcard .l{font-size:13px; font-weight:700; margin-top:8px;} .pubcard .s{font-size:12px; color:var(--mut); margin-top:3px;}
  .plans{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  .plan{background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:28px 26px; box-shadow:var(--e1);}
  .plan.hot{border:2px solid var(--coral); box-shadow:var(--e2);}
  .plan .pbadge{font-size:11px; font-weight:700; color:var(--coral-d); background:var(--coral-soft); padding:4px 10px; border-radius:999px; display:inline-block; margin-bottom:10px;}
  .plan .nm{font-size:17px; font-weight:800;} .plan .pr{font-family:"Fraunces",serif; font-size:30px; font-weight:600; margin:6px 0 2px;} .plan .sub{font-size:13px; color:var(--mut); margin-bottom:16px;}
  .plan ul{list-style:none; display:grid; gap:9px;} .plan li{font-size:14px; color:var(--sub); display:flex; gap:8px;} .plan li::before{content:'✓'; color:var(--coral); font-weight:800;}
  .faq{max-width:980px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start;}
  .faqi{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:18px 20px;}
  .faqi .q{font-size:16px; font-weight:700;} .faqi .a{font-size:14px; color:var(--sub); margin-top:8px;}
  .tgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px;}
  .tcard{background:var(--paper); border:1px solid var(--line); border-radius:18px; padding:26px; box-shadow:var(--e1);}
  .tcard .sts{color:#e6a12f; font-size:15px; letter-spacing:2px; margin-bottom:14px;}
  .tcard .tq{font-size:15px; color:var(--ink); line-height:1.65;}
  .tcard .tw{display:flex; align-items:center; gap:11px; margin-top:20px; padding-top:16px; border-top:1px solid var(--line);}
  .tcard .tw .ini{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none;}
  .tcard .tw .nm{font-size:14px; font-weight:700;} .tcard .tw .rl{font-size:12px; color:var(--mut);}
  .diffgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:24px;}
  .diffcard{background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:28px; box-shadow:var(--e1); transition:transform .18s var(--ease), box-shadow .18s var(--ease);}
  .diffcard:hover{transform:translateY(-5px); box-shadow:var(--e2);}
  .diffcard .dtop{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
  .diffcard .ic{width:44px; height:44px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:22px; flex:none;}
  .diffcard .dtag{font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px;}
  .diffcard h3{font-size:19px; font-weight:800; margin-bottom:9px; letter-spacing:-.4px;}
  .diffcard p{font-size:14px; color:var(--sub);}
  .ftr{background:var(--ink); color:#e8ddd3;}
  .ftr .fg{display:grid; grid-template-columns:1.5fr 1fr 1fr; gap:40px; padding:60px 0 36px;}
  .ftr .fbrand .brand .wm{color:#fff;}
  .ftr .fbrand p{font-size:14px; color:#b6a89c; margin-top:12px; max-width:34ch;}
  .ftr .fb{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
  .ftr .fb span{font-size:12px; font-weight:700; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); padding:6px 11px; border-radius:999px; color:#e8ddd3;}
  .ftr h4{font-size:13px; font-weight:700; color:#fff; margin-bottom:14px;}
  .ftr ul{list-style:none; display:grid; gap:10px;} .ftr li{font-size:14px; color:#b6a89c;}
  .ftr .fbot{border-top:1px solid rgba(255,255,255,.1); padding:20px 0; display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-size:13px; color:#9b8d81;}
  @media(max-width:880px){ .tgrid,.diffgrid,.faq{grid-template-columns:1fr;} .ftr .fg{grid-template-columns:1fr; gap:28px;} }
  @media(max-width:880px){ .pubgrid,.plans{grid-template-columns:1fr;} }

  .prod{display:grid; grid-template-columns:1fr 1.15fr; gap:60px; align-items:center;}
  .prod .win{width:100%;}
  .steps{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px;}
  .step{padding:0 22px;}
  .step .n{font-family:"Fraunces",serif; font-size:42px; font-weight:500; color:var(--coral); line-height:1;}
  .step h3{font-size:19px; font-weight:700; margin:12px 0 6px;}
  .step p{font-size:14px; color:var(--sub);}
  .step:not(:last-child){border-right:1px solid var(--line);}

  .checks{margin-top:24px; display:grid; gap:14px;}
  .checks .c{display:flex; gap:13px; align-items:flex-start; font-size:16px;}
  .checks .c b{color:var(--ink); font-weight:700;}
  .checks .c .k{color:#fff; background:var(--coral); width:24px; height:24px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:13px; flex:none; margin-top:1px;}
  .checks .c small{display:block; color:var(--mut); font-weight:400; font-size:14px;}

  .statb{background:var(--cream2);}
  .statb .row{display:grid; grid-template-columns:repeat(3,1fr); gap:40px; text-align:center;}
  .statb .v{font-family:"Fraunces",serif; font-size:clamp(44px,6vw,72px); font-weight:500; letter-spacing:-1px; line-height:1; color:var(--coral);}
  .statb .l{font-size:15px; color:var(--sub); margin-top:12px; font-weight:500;}

  .quote{max-width:900px; margin:0 auto; text-align:center;}
  .stars{color:#e6a12f; font-size:18px; letter-spacing:3px; margin-bottom:20px;}
  .quote .q{font-family:"Fraunces",serif; font-size:clamp(22px,3vw,32px); font-weight:400; line-height:1.5; letter-spacing:-.3px;}
  .quote .who{display:flex; align-items:center; justify-content:center; gap:12px; margin-top:28px;}
  .quote .who .ini{width:52px; height:52px; border-radius:50%; background:var(--coral-soft); color:var(--coral-d); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px;}
